name: Tarea 2 

on:
  push:
    branches:
      - '**' 

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{github.repository}}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: checkout del codigo
        uses: actions/checkout@v4
      
      - name: configurar JDK21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      
      - name: ejecucion de pruebas
        run: mvn test

  build:
    name: build jar & docker image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: checkout de codigo
        uses: actions/setup-java@v4
      
      - name: configurar JDK21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: generar el jar
        run: mvn clean package -Dskiptest

      - name: configurar imagen de docker
        run: docker build -t app-temp .

      - name: guardar imagen como artifact 
        run: docker save app-temp > imagen.tar

      - name: subir imagen artifact 
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: imagen.tar
          retention-days: 1

  publish:
    name: publish to GHCR
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: 
      contents: read
      packages: write
    steps:
      - name: descargar artifact de la imagen
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: cargar imagen de docker
        run: docker load < imagen.tar

      - name: login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{env.REGISTRY}}
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}

      - name: etiqueta y publicacion GHCR
        run: |
          REPO_LOWERCASE=$(echo "${{env.REGISTRY}}/${{env.IMAGE_NAME}} | tr '[:upper:]' '[:lower:]'")
          SHORT_SHA=${GITHUB_SHA::7}

          docker tag app-temp $REPO_LOWERCASE:lastest
          docker tag app-temp $REPO_LOWERCASE:$SHORT_SHA

          docker push $REPO_LOWERCASE:lastest
          docker push $REPO_LOWERCASE:$SHORT_SHA          
